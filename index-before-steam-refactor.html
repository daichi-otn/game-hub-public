<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAICHI-OTN GAME HUB</title>
  <style>
    :root{--bg:#101822;--panel:#192635;--panel2:#22384b;--line:#304c61;--text:#dbe7ef;--muted:#86a0b2;--blue:#66c0f4;--green:#75c97b;--orange:#e5b96a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Hiragino Sans",Meiryo,sans-serif;color:var(--text);background:radial-gradient(ellipse at 50% -10%,#244b69 0,#172534 45%,var(--bg) 80%)}body{transition:opacity .25s}body.fade-out{opacity:0}button,input,select{font:inherit}.app{min-height:100vh}
    .topbar{height:72px;background:rgba(12,20,29,.94);border-bottom:1px solid #0a1118;display:flex;align-items:center;padding:0 clamp(16px,4vw,64px);gap:34px;position:sticky;top:0;z-index:20;box-shadow:0 3px 16px #0006}.brand{font-weight:800;letter-spacing:1px;color:#fff;white-space:nowrap}.brand-mark{color:var(--blue);font-size:1.5rem;margin-right:9px;vertical-align:-2px}.nav{display:flex;gap:25px;color:var(--muted);font-size:.92rem}.nav span:first-child{color:#fff;border-bottom:2px solid var(--blue);padding-bottom:23px}.top-actions{margin-left:auto;color:var(--muted);font-size:.8rem}
    .layout{display:grid;grid-template-columns:210px minmax(0,1fr);max-width:1440px;margin:auto}.sidebar{padding:32px 18px 40px 24px;border-right:1px solid #1e3447;min-height:calc(100vh - 72px)}.side-title{text-transform:uppercase;letter-spacing:2px;font-size:.67rem;color:#67849a;margin:0 0 12px}.side-link{display:flex;justify-content:space-between;color:var(--muted);padding:9px 10px;border-radius:2px;cursor:pointer;font-size:.9rem}.side-link:hover,.side-link.active{background:var(--panel2);color:#fff}.count{font-size:.72rem;color:#63849b}
    main{min-width:0;padding:32px clamp(18px,4vw,54px) 70px}.welcome{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.welcome h1{font-size:2rem;font-weight:400;margin:0;color:#fff}.welcome p{margin:7px 0 0;color:var(--muted);font-size:.88rem}.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.search{background:#0d151e;color:#fff;border:1px solid var(--line);padding:10px 14px;width:260px;outline:0;border-radius:2px}.search:focus{border-color:var(--blue)}.select,.tool-btn{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:9px 12px;border-radius:2px;cursor:pointer}.tool-btn:hover,.select:hover{border-color:var(--blue);color:#fff}.spacer{flex:1}
    .hero{min-height:310px;position:relative;display:flex;align-items:end;overflow:hidden;text-decoration:none;color:var(--text);background:linear-gradient(90deg,#162638 0,#1b3449 45%,#234d6a 100%);box-shadow:0 8px 26px #0007;margin-bottom:28px}.hero:before{content:"";position:absolute;inset:0 0 0 35%;background-image:var(--hero-image);background-size:cover;background-position:center;opacity:.7;mask-image:linear-gradient(90deg,transparent,#000 35%)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#162638 0,transparent 65%)}.hero-info{position:relative;z-index:1;padding:38px;max-width:620px}.hero-label{color:var(--blue);font-size:.7rem;letter-spacing:3px;text-transform:uppercase}.hero h2{font-size:clamp(2rem,4vw,3.3rem);margin:9px 0;color:#fff;font-weight:700;text-shadow:0 3px 12px #000}.hero p{line-height:1.6;color:#c8d7e2}.play{display:inline-block;background:linear-gradient(#8bd4f8,#4d9fc9);color:#102333;font-weight:800;padding:11px 22px;margin-top:8px;border-radius:2px}
    .section-title{font-size:1.25rem;font-weight:400;color:#fff;border-bottom:1px solid var(--line);padding-bottom:11px;margin:30px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:10px}.tile{min-width:0;display:flex;position:relative;min-height:112px;background:var(--panel);color:var(--text);text-decoration:none;box-shadow:0 2px 6px #0005;transition:.2s}.tile:hover{transform:translateX(4px);background:var(--panel2);box-shadow:0 7px 15px #0007}.tile.disabled{opacity:.55}.thumb{width:132px;min-width:132px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;overflow:hidden}.thumb img,.detail-icon img{width:72%;height:72%;object-fit:contain;border-radius:20%}.tile-body{min-width:0;padding:13px 14px;display:flex;flex-direction:column;gap:6px}.tile-title{font-weight:600;color:#fff;line-height:1.3}.tile-desc{margin:0;color:#9fb4c2;font-size:.78rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.tile-meta{margin-top:auto;color:var(--blue);font-size:.7rem}.status{font-size:.62rem;padding:3px 7px;margin-left:6px;background:var(--green);color:#102333}.status.wip{background:var(--orange)}.status.local{background:#8eb8d8}.fav{position:absolute;right:7px;top:7px;border:0;background:#0c1822cc;color:#7890a0;cursor:pointer;font-size:1rem}.fav.on{color:#ffd34e}
    .recent-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}.recent-row .tile{flex:0 0 310px}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:45px}.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px}.detail-card{display:grid;grid-template-columns:52px 1fr;gap:13px;background:var(--panel);padding:17px}.detail-icon{width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--panel2);font-size:1.7rem}.detail-head{display:flex;align-items:center;gap:4px}.detail-title{color:#fff;font-weight:600}.detail-text{color:#a8bac6;line-height:1.6;font-size:.82rem;margin:8px 0}.detail-link{color:var(--blue);font-size:.8rem}.footer{text-align:center;color:#688096;border-top:1px solid #1c3040;padding:25px;font-size:.8rem}.page-tools{text-align:center;margin:30px}.reset{background:none;border:0;color:#688096;text-decoration:underline;cursor:pointer;font-size:.75rem}.enter{animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.hidden{display:none!important}@media(prefers-reduced-motion:reduce){.enter{animation:none}}@media(max-width:780px){.topbar{gap:16px}.nav{display:none}.layout{display:block}.sidebar{min-height:0;border-right:0;border-bottom:1px solid #1e3447;padding:12px 14px;display:flex;gap:7px;overflow:auto}.side-title{display:none}.side-link{white-space:nowrap}.welcome h1{font-size:1.55rem}.top-actions{display:none}.hero-info{padding:26px}.grid{grid-template-columns:1fr}.thumb{width:110px;min-width:110px}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand"><span class="brand-mark">◉</span><span id="logo">DAICHI-OTN GAME HUB</span></div><nav class="nav"><span>ライブラリ</span><span>コレクション</span></nav><div class="top-actions" id="stats"></div></header>
  <div class="layout">
    <aside class="sidebar"><div class="side-title">ライブラリ</div><div class="side-link active" data-filter="すべて">すべて <span class="count" id="all-count"></span></div><div class="side-link" data-filter="お気に入り">お気に入り <span class="count" id="fav-count"></span></div><div class="side-link" data-filter="公開中">公開中</div><div class="side-link" data-filter="ミニ作品">ミニ作品</div><div class="side-link" data-filter="準備中">準備中</div></aside>
    <main>
      <div class="welcome"><div><h1>ゲームライブラリ</h1><p>あなたのゲームコレクション</p></div><button class="tool-btn" id="random" type="button">🎲 ランダムに遊ぶ</button></div>
      <a class="hero" id="hero" href="#"></a>
      <div class="tools"><input class="search" id="search" type="search" placeholder="ゲームを検索（/）"><select class="select" id="sort"><option>おすすめ</option><option>最近遊んだ順</option><option>よく遊ぶ順</option><option>名前順</option></select><span class="spacer"></span><span class="count" id="result-count"></span></div>
      <section class="recent hidden" id="recent"><div class="section-title">最近遊んだゲーム</div><div class="recent-row" id="recent-row"></div></section>
      <section><div class="section-title">すべてのゲーム</div><div class="grid" id="grid"></div></section>
      <section><div class="section-title">ゲーム紹介</div><div class="details" id="details"></div></section>
      <div class="page-tools"><button class="reset" id="clear-plays" type="button">遊んだ記録をリセット</button></div>
    </main>
  </div>
  <footer class="footer">&copy; <a id="footer-link" target="_blank" rel="noopener" style="color:inherit"></a></footer>
</div>
<script src="games-data.js"></script>
<script>
  const $=id=>document.getElementById(id),VISIBLE_GAMES=GAMES.filter(g=>!g.hidden),SETTINGS=Object.assign({title:'DAICHI-OTN GAME HUB',heroLabel:'注目のゲーム',footerText:'DAICHI-OTN',footerUrl:'https://github.com/daichi-otn'},typeof HUB_SETTINGS!=='undefined'?HUB_SETTINGS:{});const STATUS={live:'公開中',wip:'準備中',local:'ミニ作品'},PLAY_KEY='daichi-otn-hub-plays',FAV_KEY='daichi-otn-hub-favs',state={filter:'すべて',query:'',sort:'おすすめ'};const load=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch(e){return fallback}},plays=()=>load(PLAY_KEY,{}),favs=()=>load(FAV_KEY,[]),fav=t=>favs().includes(t),status=g=>g.url?g.status:'wip';
  function setIcon(el,icon){el.textContent='';if(/\.(png|jpe?g|gif|webp|svg)$/i.test(icon)){const i=document.createElement('img');i.src=icon;i.alt='';el.append(i)}else el.textContent=icon}function record(t){const p=plays(),v=p[t]||{count:0,last:0};p[t]={count:v.count+1,last:Date.now()};localStorage.setItem(PLAY_KEY,JSON.stringify(p))}function toggle(t){const f=favs(),i=f.indexOf(t);i<0?f.push(t):f.splice(i,1);localStorage.setItem(FAV_KEY,JSON.stringify(f));return i<0}function go(url,title){if(title)record(title);document.body.classList.add('fade-out');setTimeout(()=>location.href=url,250)}function apply(){document.title=SETTINGS.title;$('logo').textContent=SETTINGS.title;$('footer-link').textContent=SETTINGS.footerText;$('footer-link').href=SETTINGS.footerUrl}
  function hero(){const g=VISIBLE_GAMES.find(x=>x.featured&&x.url)||VISIBLE_GAMES.find(x=>status(x)==='live'&&x.url),h=$('hero');if(!g){h.style.display='none';return}h.href=g.url;h.dataset.title=g.title;if(/\.(png|jpe?g|gif|webp|svg)$/i.test(g.icon))h.style.setProperty('--hero-image',"url('"+g.icon+"')");h.innerHTML='<div class="hero-info"><div class="hero-label"></div><h2></h2><p></p><span class="play">▶ 遊ぶ</span></div>';h.querySelector('.hero-label').textContent=SETTINGS.heroLabel;h.querySelector('h2').textContent=g.title;h.querySelector('p').textContent=g.desc}
  function meta(g){const p=plays()[g.title];return p?'遊んだ '+p.count+' 回 ・ 最終 '+new Date(p.last).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'}):'まだ遊んでいません'}function tile(g){const a=document.createElement(g.url?'a':'div');a.className='tile'+(g.url?'':' disabled');if(g.url)a.href=g.url;a.dataset.title=g.title;const th=document.createElement('div');th.className='thumb';th.style.background='linear-gradient(135deg,'+g.color+',#101822)';setIcon(th,g.icon);const body=document.createElement('div');body.className='tile-body';const title=document.createElement('div');title.className='tile-title';title.append(document.createTextNode(g.title));const badge=document.createElement('span');badge.className='status '+status(g);badge.textContent=STATUS[status(g)];title.append(badge);const d=document.createElement('p');d.className='tile-desc';d.textContent=g.desc;body.append(title,d);if(g.url){const m=document.createElement('div');m.className='tile-meta';m.textContent=meta(g);body.append(m)}const b=document.createElement('button');b.className='fav'+(fav(g.title)?' on':'');b.textContent='★';b.title='お気に入り';b.onclick=e=>{e.preventDefault();e.stopPropagation();b.classList.toggle('on',toggle(g.title));stats();if(state.filter==='お気に入り')grid()};a.append(th,body,b);return a}
  function matches(g){return(state.filter==='すべて'||(state.filter==='お気に入り'?fav(g.title):STATUS[status(g)]===state.filter))&&(!state.query||[g.title,g.desc,g.detail].join(' ').toLowerCase().includes(state.query))}function sorted(list){const p=plays(),a=[...list];if(state.sort==='最近遊んだ順')a.sort((x,y)=>(p[y.title]?.last||0)-(p[x.title]?.last||0));if(state.sort==='よく遊ぶ順')a.sort((x,y)=>(p[y.title]?.count||0)-(p[x.title]?.count||0));if(state.sort==='名前順')a.sort((x,y)=>x.title.localeCompare(y.title,'ja'));return a}
  function grid(){const box=$('grid');box.innerHTML='';const list=sorted(VISIBLE_GAMES.filter(matches));$('result-count').textContent=list.length+' 件';if(!list.length){box.innerHTML='<div class="empty">該当するゲームがありません</div>';return}list.forEach((g,i)=>{const t=tile(g);t.classList.add('enter');t.style.animationDelay=i*45+'ms';box.append(t)})}function recent(){const p=plays(),list=VISIBLE_GAMES.filter(g=>g.url&&p[g.title]).sort((a,b)=>p[b.title].last-p[a.title].last).slice(0,4),box=$('recent');box.classList.toggle('hidden',!list.length);$('recent-row').replaceChildren(...list.map(tile))}
  function details(){const box=$('details');box.replaceChildren(...VISIBLE_GAMES.map(g=>{const c=document.createElement('div');c.className='detail-card';const i=document.createElement('div');i.className='detail-icon';i.style.background='linear-gradient(135deg,'+g.color+',#101822)';setIcon(i,g.icon);const info=document.createElement('div');const h=document.createElement('div');h.className='detail-head';const title=document.createElement('span');title.className='detail-title';title.textContent=g.title;const badge=document.createElement('span');badge.className='status '+status(g);badge.textContent=STATUS[status(g)];h.append(title,badge);const p=document.createElement('p');p.className='detail-text';p.textContent=g.detail;info.append(h,p);if(g.url){const a=document.createElement('a');a.className='detail-link';a.href=g.url;a.textContent='遊ぶ →';info.append(a)}c.append(i,info);return c}))}function stats(){$('stats').textContent='全 '+VISIBLE_GAMES.length+' 作品 ・ 公開中 '+VISIBLE_GAMES.filter(g=>status(g)==='live').length;$('all-count').textContent=VISIBLE_GAMES.length;$('fav-count').textContent=favs().length}
  document.querySelectorAll('.side-link').forEach(x=>x.onclick=()=>{state.filter=x.dataset.filter;document.querySelectorAll('.side-link').forEach(y=>y.classList.toggle('active',y===x));grid()});$('search').oninput=e=>{state.query=e.target.value.toLowerCase().trim();grid()};$('sort').onchange=e=>{state.sort=e.target.value;grid()};$('random').onclick=()=>{const p=VISIBLE_GAMES.filter(g=>g.url);if(p.length){const g=p[Math.floor(Math.random()*p.length)];go(g.url,g.title)}};$('clear-plays').onclick=()=>{if(confirm('遊んだ記録をリセットしますか？')){localStorage.removeItem(PLAY_KEY);recent();grid()}};document.addEventListener('keydown',e=>{if(e.key==='/'&&!/input|textarea|select/i.test(e.target.tagName)){e.preventDefault();$('search').focus()}});document.addEventListener('click',e=>{const a=e.target.closest('a.tile,a.hero,.detail-link');if(!a||!a.href||a.target==='_blank')return;e.preventDefault();go(a.href,a.dataset.title||'')});apply();hero();stats();recent();grid();details();
</script>
</body>
</html>
