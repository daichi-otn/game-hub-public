<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAICHI-OTN GAME HUB</title>
  <style>
    :root{--bg:#171a21;--sub:#1b2838;--panel:#213448;--line:#2a475e;--blue:#66c0f4;--text:#d6d7d8;--muted:#8f98a0;--green:#75b85a;--gold:#e5b96a}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 60% -10%,#294866 0,#1b2838 30%,#171a21 70%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",Meiryo,sans-serif;min-height:100vh;transition:opacity .25s}body.fade-out{opacity:0}button,input,select{font:inherit}.hidden{display:none!important}
    .topbar{height:76px;display:flex;align-items:center;gap:28px;padding:0 34px;background:rgba(23,26,33,.96);border-bottom:1px solid #0e131a;box-shadow:0 3px 20px #0008;position:sticky;top:0;z-index:50}.brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:1.05rem;font-weight:800;letter-spacing:1px;white-space:nowrap}.brand-icon{width:34px;height:34px;display:grid;place-items:center;border:2px solid var(--blue);border-radius:50%;color:var(--blue);box-shadow:0 0 14px #66c0f466}.brand-sub{display:block;color:var(--blue);font-size:.62rem;letter-spacing:2px;font-weight:500}.topnav{display:flex;align-items:center;gap:25px;margin-left:20px;color:var(--muted);font-size:.9rem}.topnav button{border:0;background:none;color:inherit;cursor:pointer;padding:28px 0}.topnav button:hover,.topnav button.active{color:#fff;border-bottom:2px solid var(--blue)}.header-search{margin-left:auto;display:flex;align-items:center;background:#0e141b;border:1px solid #31536a;box-shadow:inset 0 0 8px #0008}.header-search:focus-within{border-color:var(--blue);box-shadow:0 0 12px #66c0f444}.header-search span{padding:0 10px;color:#6e8ba0}.header-search input{width:210px;padding:10px 10px 10px 0;border:0;outline:0;color:#fff;background:transparent;font-size:.82rem}.top-actions{color:#7893a4;font-size:.72rem;white-space:nowrap}.profile{display:flex;align-items:center;gap:9px;color:#b6c6d0;font-size:.75rem}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:3px;background:linear-gradient(135deg,#66c0f4,#32617f);color:#10202b;font-weight:800;box-shadow:0 0 12px #66c0f444}.online{color:#72c77a}.online::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#72c77a;box-shadow:0 0 7px #72c77a;margin-right:5px}
    .shell{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1600px;margin:auto;min-height:calc(100vh - 76px)}.sidebar{padding:30px 18px;background:rgba(27,40,56,.74);border-right:1px solid #243d50}.side-heading{color:#6e8799;text-transform:uppercase;letter-spacing:2px;font-size:.67rem;margin:0 10px 12px}.side-menu{display:grid;gap:3px;margin-bottom:29px}.side-link{width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;border:0;background:transparent;color:#a8b7c2;text-align:left;cursor:pointer;border-radius:2px;font-size:.88rem}.side-link:hover,.side-link.active{background:linear-gradient(90deg,#2a475e,#24415a);color:#fff;box-shadow:inset 3px 0 var(--blue)}.side-link .symbol{width:20px;text-align:center;color:var(--blue)}.side-count{margin-left:auto;color:#7090a6;font-size:.72rem}.side-search{display:flex;background:#111920;border:1px solid #31536a;margin:0 2px 12px}.side-search input{width:100%;padding:9px;background:transparent;border:0;outline:0;color:#fff;font-size:.78rem}.side-games{display:grid;gap:2px;max-height:390px;overflow:auto}.side-game{padding:8px 10px;color:#8da2b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-size:.78rem}.side-game:hover{color:#fff;background:#22384b}
    main{min-width:0;padding:35px clamp(20px,4vw,58px) 70px}.page-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.page-title h1{margin:0;color:#fff;font-size:2.05rem;font-weight:300}.page-title p{margin:7px 0 0;color:var(--muted);font-size:.82rem}.quick-actions{display:flex;gap:8px}.action{background:#22384b;color:#cce1ed;border:1px solid #3a6079;border-radius:2px;padding:9px 13px;cursor:pointer;font-size:.78rem}.action:hover{background:#2d5975;color:#fff;box-shadow:0 0 14px #66c0f433}
    .hero{display:flex;align-items:end;min-height:345px;position:relative;overflow:hidden;color:#fff;text-decoration:none;background:linear-gradient(90deg,#142536,#1d4059 52%,#345a75);box-shadow:0 12px 30px #000a;border:1px solid #31546b}.hero::before{content:"";position:absolute;inset:0 0 0 28%;background-image:var(--hero-image);background-size:cover;background-position:center;opacity:.72;mask-image:linear-gradient(90deg,transparent,#000 30%,#000)}.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#142536 0%,rgba(20,37,54,.82) 32%,transparent 72%),linear-gradient(0deg,rgba(10,18,27,.65),transparent 60%)}.hero-content{position:relative;z-index:1;padding:42px;max-width:650px}.hero-kicker{color:var(--blue);font-size:.68rem;letter-spacing:3px;text-transform:uppercase}.hero h2{margin:10px 0;color:#fff;font-size:clamp(2rem,4.5vw,3.7rem);font-weight:700;text-shadow:0 3px 16px #000}.hero p{line-height:1.65;color:#d4e1e9;max-width:520px}.play{display:inline-flex;align-items:center;gap:9px;margin-top:10px;padding:13px 28px;background:linear-gradient(180deg,#8dd766,#5a963f);border:1px solid #a2ed7e;border-radius:3px;color:#162218;font-size:1rem;font-weight:800;box-shadow:0 0 18px #75b85a55}.play:hover{filter:brightness(1.15);transform:translateY(-2px);box-shadow:0 0 25px #75b85a99}
    .library-head{display:flex;align-items:center;gap:16px;margin:34px 0 13px;border-bottom:1px solid var(--line);padding-bottom:12px}.library-head h2{margin:0;color:#fff;font-weight:400;font-size:1.35rem}.library-head span{color:#7693a5;font-size:.75rem}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:17px}.filter{background:transparent;color:#8fa9ba;border:1px solid transparent;border-radius:2px;padding:8px 13px;cursor:pointer;font-size:.77rem}.filter:hover,.filter.active{background:#2a475e;color:#fff;border-color:#3f6983}.sort{margin-left:auto;background:#111920;color:#b9c9d3;border:1px solid #31536a;border-radius:2px;padding:8px 11px;font-size:.77rem}.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:11px}.game-card{display:flex;min-height:120px;position:relative;background:var(--sub);color:var(--text);text-decoration:none;border:1px solid transparent;box-shadow:0 2px 8px #0008;transition:transform .22s ease,background .22s,border-color .22s,box-shadow .22s}.game-card:hover{transform:scale(1.025) translateY(-3px);background:#22384b;border-color:var(--blue);box-shadow:0 0 18px #66c0f466,0 10px 20px #0008;z-index:2}.game-card.disabled{opacity:.5}.game-thumb{width:142px;min-width:142px;display:grid;place-items:center;font-size:2.3rem;overflow:hidden}.game-thumb img,.info-icon img{width:72%;height:72%;object-fit:contain;border-radius:18%}.game-info{min-width:0;padding:14px 15px;display:flex;flex-direction:column;gap:6px}.game-name{color:#fff;font-size:.94rem;font-weight:600;line-height:1.3}.badge{display:inline-block;margin-left:7px;padding:3px 7px;color:#15202a;background:#75c97b;border-radius:2px;font-size:.6rem;vertical-align:2px}.badge.wip{background:var(--gold)}.badge.local{background:#8eb8d8}.game-desc{margin:0;color:#9fb1bc;font-size:.76rem;line-height:1.48;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.game-meta{margin-top:auto;color:var(--blue);font-size:.68rem}.favorite{position:absolute;right:7px;top:6px;border:0;background:#101a23dd;color:#698395;cursor:pointer;font-size:1rem}.favorite.on{color:#ffd34e}.recent-row{display:flex;gap:10px;overflow:auto;padding-bottom:7px}.recent-row .game-card{flex:0 0 330px}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:42px}.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:10px}.info-card{display:grid;grid-template-columns:54px 1fr;gap:14px;background:var(--sub);padding:18px}.info-icon{width:54px;height:54px;display:grid;place-items:center;background:var(--panel);font-size:1.7rem}.info-title{color:#fff;font-weight:600}.info-text{color:#a9bbc6;font-size:.8rem;line-height:1.6;margin:8px 0}.info-link{color:var(--blue);font-size:.78rem}.footer{text-align:center;color:#6d8494;border-top:1px solid #20394d;padding:25px;font-size:.78rem}.footer a{color:inherit}
    @keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.appear{animation:appear .4s both}@media(prefers-reduced-motion:reduce){.appear{animation:none}}@media(max-width:900px){.topnav{display:none}.header-search{margin-left:auto}.shell{grid-template-columns:190px minmax(0,1fr)}.sidebar{padding-left:12px}.game-grid{grid-template-columns:1fr}}@media(max-width:700px){.topbar{height:64px;padding:0 14px}.profile{display:none}.header-search input{width:140px}.shell{display:block}.sidebar{min-height:0;display:flex;gap:5px;padding:8px;overflow:auto;border-right:0}.side-heading,.side-search,.side-games{display:none}.side-menu{display:flex;gap:4px;margin:0}.side-link{white-space:nowrap}.page-title h1{font-size:1.55rem}.quick-actions{display:none}main{padding:24px 14px 55px}.hero{min-height:270px}.hero-content{padding:25px}.hero::before{inset:0;opacity:.35}.game-grid{grid-template-columns:1fr}.game-thumb{width:110px;min-width:110px}.details{grid-template-columns:1fr}}

    /* ゲームアート表示 */
    .hero{background-image:linear-gradient(90deg,rgba(23,26,33,.95) 0%,rgba(23,26,33,.78) 34%,rgba(23,26,33,.25) 72%,rgba(23,26,33,.45) 100%),linear-gradient(0deg,rgba(23,26,33,.95) 0%,transparent 55%),var(--hero-image);background-size:cover;background-position:center}.hero::before{display:none}.hero::after{background:linear-gradient(90deg,rgba(23,26,33,.95),transparent 68%),linear-gradient(0deg,rgba(23,26,33,.72),transparent 58%)}
    .game-card{display:flex;flex-direction:column;min-height:0}.game-thumb{position:relative;width:100%;min-width:0;aspect-ratio:16/9;height:auto;background:#24394a!important}.game-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,14,20,.82),transparent 55%);pointer-events:none}.game-thumb img{width:100%;height:100%;display:block;object-fit:cover;border-radius:0;transition:transform .45s cubic-bezier(.16,1,.3,1),filter .3s}.game-card:hover .game-thumb img{transform:scale(1.07);filter:brightness(1.12)}.art-overlay{position:absolute;inset:auto 10px 9px;z-index:1;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:.68rem;text-shadow:0 1px 3px #000}.art-play{padding:5px 9px;background:rgba(102,192,244,.9);color:#10202b;font-weight:800;border-radius:2px}.art-date{color:#d5e3eb}.game-info{padding:13px 15px 15px}.favorite{z-index:3}.recent-row .game-card{flex:0 0 300px}
  </style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-icon">◉</span><div><div id="logo">DAICHI-OTN GAME HUB</div><span class="brand-sub">GAME LIBRARY</span></div></div><nav class="topnav"><button class="active" data-scroll="top">ホーム</button><button data-scroll="library">ライブラリ</button><button data-scroll="details-section">コレクション</button></nav><div class="header-search"><span>⌕</span><input id="header-search" type="search" placeholder="検索"></div><div class="top-actions" id="stats"></div><div class="profile"><span class="online">オンライン</span><span class="avatar">D</span></div></header>
<div class="shell">
  <aside class="sidebar"><div class="side-heading">GAME HUB</div><div class="side-menu"><button class="side-link active" data-filter="すべて"><span class="symbol">⌂</span>ホーム <span class="side-count" id="all-count"></span></button><button class="side-link" data-filter="お気に入り"><span class="symbol">★</span>お気に入り <span class="side-count" id="fav-count"></span></button><button class="side-link" data-filter="公開中"><span class="symbol">▶</span>公開中</button><button class="side-link" data-filter="ミニ作品"><span class="symbol">◆</span>ミニ作品</button><button class="side-link" data-filter="準備中"><span class="symbol">◷</span>準備中</button></div><div class="side-heading">ゲームを探す</div><div class="side-search"><input id="side-search" type="search" placeholder="ゲームを検索"></div><div class="side-games" id="side-games"></div></aside>
  <main id="top"><div class="page-title"><div><h1>ゲームライブラリ</h1><p>DAICHI-OTNのゲームコレクションへようこそ</p></div><div class="quick-actions"><button class="action" id="random">🎲 ランダム</button><button class="action" id="clear-plays">履歴を消去</button></div></div><a class="hero" id="hero" href="#"></a><div class="library-head" id="library"><h2>ゲーム</h2><span id="result-count"></span></div><div class="filters"><div id="filters"></div><select class="sort" id="sort"><option>おすすめ</option><option>最近遊んだ順</option><option>よく遊ぶ順</option><option>名前順</option></select></div><section class="recent hidden" id="recent"><div class="library-head"><h2>最近遊んだゲーム</h2></div><div class="recent-row" id="recent-row"></div></section><div class="game-grid" id="grid"></div><section id="details-section"><div class="library-head"><h2>ゲーム紹介</h2></div><div class="details" id="details"></div></section></main>
</div><footer class="footer">&copy; <a id="footer-link" target="_blank" rel="noopener"></a></footer>
<script src="games-data.js"></script><script>
const $=id=>document.getElementById(id),G=GAMES.filter(g=>!g.hidden),S=Object.assign({title:'DAICHI-OTN GAME HUB',heroLabel:'注目のゲーム',footerText:'DAICHI-OTN',footerUrl:'https://github.com/daichi-otn'},typeof HUB_SETTINGS!=='undefined'?HUB_SETTINGS:{}),STATUS={live:'公開中',wip:'準備中',local:'ミニ作品'},PLAY='daichi-otn-hub-plays',FAV='daichi-otn-hub-favs',state={filter:'すべて',query:'',sort:'おすすめ'};
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}},plays=()=>load(PLAY,{}),favs=()=>load(FAV,[]),isFav=t=>favs().includes(t),kind=g=>g.url?g.status:'wip';function setIcon(e,x){e.textContent='';if(/\.(png|jpe?g|gif|webp|svg)$/i.test(x)){const i=document.createElement('img');i.src=x;i.alt='';e.append(i)}else e.textContent=x}function record(t){if(!t)return;const p=plays(),v=p[t]||{count:0,last:0};p[t]={count:v.count+1,last:Date.now()};localStorage.setItem(PLAY,JSON.stringify(p))}function go(url,title){record(title);document.body.classList.add('fade-out');setTimeout(()=>location.href=url,250)}
function apply(){document.title=S.title;$('logo').textContent=S.title;$('footer-link').textContent=S.footerText;$('footer-link').href=S.footerUrl}const FALLBACK_IMAGES=['https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1200&q=82','https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1200&q=82','https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=82','https://images.unsplash.com/photo-1538481190172-c8f2b5c7f8d7?auto=format&fit=crop&w=1200&q=82'];function fallbackImage(g){let n=0;for(const c of g.title)n=(n+c.charCodeAt(0))%FALLBACK_IMAGES.length;return FALLBACK_IMAGES[n]}function gameImage(g){return g.image||g.screenshot||fallbackImage(g)}function heroImage(g){return g.heroImage||g.image||g.screenshot||fallbackImage(g)}function hero(){const p=plays(),g=G.filter(x=>x.url&&p[x.title]).sort((a,b)=>p[b.title].last-p[a.title].last)[0]||G.find(x=>x.featured&&x.url)||G.find(x=>kind(x)==='live'&&x.url),h=$('hero');if(!g){h.classList.add('hidden');return}h.href=g.url;h.dataset.title=g.title;h.style.setProperty('--hero-image',"url('"+heroImage(g)+"')");h.innerHTML='<div class="hero-content"><div class="hero-kicker"></div><h2></h2><p></p><span class="play">▶ PLAY</span></div>';h.querySelector('.hero-kicker').textContent=S.heroLabel;h.querySelector('h2').textContent=g.title;h.querySelector('p').textContent=g.desc}
function meta(g){const p=plays()[g.title];return p?'遊んだ '+p.count+' 回 ・ 最終 '+new Date(p.last).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'}):'まだ遊んでいません'}function toggle(t){const f=favs(),i=f.indexOf(t);i<0?f.push(t):f.splice(i,1);localStorage.setItem(FAV,JSON.stringify(f));return i<0}
function card(g){const a=document.createElement(g.url?'a':'div');a.className='game-card'+(g.url?'':' disabled');if(g.url)a.href=g.url;a.dataset.title=g.title;const th=document.createElement('div');th.className='game-thumb';const image=document.createElement('img');image.src=gameImage(g);image.alt=g.title+' スクリーンショット';image.loading='lazy';image.onerror=()=>{image.src=FALLBACK_IMAGES[0]};const overlay=document.createElement('div');overlay.className='art-overlay';overlay.innerHTML=(g.url?'<span class="art-play">▶ PLAY</span>':'<span></span>')+'<span class="art-date">'+meta(g)+'</span>';th.append(image,overlay);const info=document.createElement('div');info.className='game-info';const n=document.createElement('div');n.className='game-name';n.append(document.createTextNode(g.title));const b=document.createElement('span');b.className='badge '+kind(g);b.textContent=STATUS[kind(g)];n.append(b);const d=document.createElement('p');d.className='game-desc';d.textContent=g.desc;info.append(n,d);const f=document.createElement('button');f.className='favorite'+(isFav(g.title)?' on':'');f.textContent='★';f.title='お気に入り';f.onclick=e=>{e.preventDefault();e.stopPropagation();f.classList.toggle('on',toggle(g.title));stats();if(state.filter==='お気に入り')render()};a.append(th,info,f);return a}
function match(g){return(state.filter==='すべて'||(state.filter==='お気に入り'?isFav(g.title):STATUS[kind(g)]===state.filter))&&(!state.query||[g.title,g.desc,g.detail].join(' ').toLowerCase().includes(state.query))}function sort(a){const p=plays(),r=[...a];if(state.sort==='最近遊んだ順')r.sort((x,y)=>(p[y.title]?.last||0)-(p[x.title]?.last||0));if(state.sort==='よく遊ぶ順')r.sort((x,y)=>(p[y.title]?.count||0)-(p[x.title]?.count||0));if(state.sort==='名前順')r.sort((x,y)=>x.title.localeCompare(y.title,'ja'));return r}function render(){const box=$('grid');box.replaceChildren();const list=sort(G.filter(match));$('result-count').textContent=list.length+' 件';if(!list.length){box.innerHTML='<div class="empty">該当するゲームがありません</div>';return}list.forEach((g,i)=>{const x=card(g);x.classList.add('appear');x.style.animationDelay=i*40+'ms';box.append(x)})}function recent(){const p=plays(),list=G.filter(g=>g.url&&p[g.title]).sort((a,b)=>p[b.title].last-p[a.title].last).slice(0,4);$('recent').classList.toggle('hidden',!list.length);$('recent-row').replaceChildren(...list.map(card))}function details(){const box=$('details');box.replaceChildren(...G.map(g=>{const c=document.createElement('div');c.className='info-card';const i=document.createElement('div');i.className='info-icon';i.style.background='linear-gradient(135deg,'+g.color+',#101822)';setIcon(i,g.icon);const wrap=document.createElement('div'),h=document.createElement('div');h.className='info-title';h.textContent=g.title;const p=document.createElement('p');p.className='info-text';p.textContent=g.detail;wrap.append(h,p);if(g.url){const a=document.createElement('a');a.className='info-link';a.href=g.url;a.textContent='▶ 遊ぶ';wrap.append(a)}c.append(i,wrap);return c}))}
function stats(){$('all-count').textContent=G.length;$('fav-count').textContent=favs().length;$('stats').textContent='全 '+G.length+' 作品 ・ 公開中 '+G.filter(g=>kind(g)==='live').length}function sideList(){const box=$('side-games');box.replaceChildren(...G.map(g=>{const x=document.createElement('div');x.className='side-game';x.textContent=g.title;x.onclick=()=>{if(g.url)go(g.url,g.title)};return x}))}function filters(){const box=$('filters');box.replaceChildren(...['すべて','お気に入り','公開中','ミニ作品','準備中'].map(n=>{const b=document.createElement('button');b.className='filter'+(state.filter===n?' active':'');b.textContent=n;b.onclick=()=>{state.filter=n;filters();render()};return b}))}
document.querySelectorAll('.side-link').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;document.querySelectorAll('.side-link').forEach(x=>x.classList.toggle('active',x===b));filters();render()});document.querySelectorAll('.topnav button').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.scroll).scrollIntoView({behavior:'smooth'}));function search(v){state.query=v.toLowerCase().trim();$('header-search').value=v;$('side-search').value=v;render()}$('header-search').oninput=e=>search(e.target.value);$('side-search').oninput=e=>search(e.target.value);$('sort').onchange=e=>{state.sort=e.target.value;render()};$('random').onclick=()=>{const a=G.filter(g=>g.url);if(a.length){const g=a[Math.floor(Math.random()*a.length)];go(g.url,g.title)}};$('clear-plays').onclick=()=>{if(confirm('遊んだ記録をリセットしますか？')){localStorage.removeItem(PLAY);hero();recent();render()}};document.addEventListener('keydown',e=>{if(e.key==='/'&&!/input|textarea|select/i.test(e.target.tagName)){e.preventDefault();$('header-search').focus()}});document.addEventListener('click',e=>{const a=e.target.closest('a.game-card,a.hero,.info-link');if(!a||!a.href||a.target==='_blank')return;e.preventDefault();go(a.href,a.dataset.title||'')});apply();hero();stats();sideList();filters();recent();render();details();
</script>
</body>
</html>
