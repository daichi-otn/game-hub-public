<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ジオメトリ・ダッシュ：ネオン・リズム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;900&family=Orbitron:wght@600;900&display=swap');

        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'M PLUS 1p', 'Orbitron', sans-serif;
            background-color: #030308;
            color: #ffffff;
            overflow: hidden;
        }

        .neon-glow-cyan {
            box-shadow: 0 0 15px #00f3ff, inset 0 0 10px #00f3ff;
            border: 2px solid #00f3ff;
        }

        .neon-text-cyan { text-shadow: 0 0 8px #00f3ff, 0 0 18px #00f3ff; }
        .neon-text-pink { text-shadow: 0 0 8px #ff007f, 0 0 18px #ff007f; }

        .glass-panel {
            background: rgba(8, 12, 28, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 243, 255, 0.25);
        }

        .btn-gd {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .btn-gd:hover {
            transform: translateY(-2px) scale(1.03);
            filter: brightness(1.25);
        }

        .btn-gd:active {
            transform: translateY(1px) scale(0.97);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
        ::-webkit-scrollbar-thumb { background: #00f3ff; border-radius: 3px; }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center p-0 m-0 bg-slate-950 select-none">

    <script>
        // サウンドエンジン
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playJump() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }
            playOrb() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
            playExplode() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
        }

        const sound = new SoundEngine();

        const CANVAS_WIDTH = 900;
        const CANVAS_HEIGHT = 500;
        const GROUND_Y = 400;
        const GRID_SIZE = 40;
        const FIXED_TIMESTEP = 1000 / 60; // 60FPS固定物理計算

        let ctx = canvas.getContext('2d');
        canvas.width = CANVAS_WIDTH;

            hudProgressText: document.getElementById('hud-progress-text'),
            hudProgressBar: document.getElementById('hud-progress-bar'),
            hudAttempts: document.getElementById('hud-attempts'),
            starsDisplay: document.getElementById('shop-stars-display'),
            orbsDisplay: document.getElementById('shop-orbs-display')
        };

        function getCurrentLevel() {
            if (gameState === 'editor' || currentLevelIdx === 3) {
                return customLevel;
            }
            return levels[currentLevelIdx];
        }

        function setupEventListeners() {
            // メイン画面のボタン
            document.getElementById('btn-prev-level').onclick = () => {
                currentLevelIdx = (currentLevelIdx - 1 + 4) % 4;
                updateLevelCard();
            };
            document.getElementById('btn-next-level').onclick = () => {
                currentLevelIdx = (currentLevelIdx + 1) % 4;
                updateLevelCard();
            };
            document.getElementById('btn-play-normal').onclick = () => {
                sound.init();
                isPractice = false;
                startPlay();
            };
            document.getElementById('btn-play-practice').onclick = () => {
                sound.init();
                isPractice = true;
                startPlay();
            };
            document.getElementById('btn-open-shop').onclick = () => {
                ui.startScreen.classList.add('hidden');
                ui.shopScreen.classList.remove('hidden');
                drawShopPreview();
            };
            document.getElementById('btn-close-shop').onclick = () => {
                ui.shopScreen.classList.add('hidden');
                ui.startScreen.classList.remove('hidden');
            };
            document.getElementById('btn-shop-back').onclick = () => {
                ui.shopScreen.classList.add('hidden');
                ui.startScreen.classList.remove('hidden');
            };
            document.getElementById('btn-open-editor').onclick = () => {
                sound.init();
                gameState = 'editor';
                ui.startScreen.classList.add('hidden');
                ui.editorToolbar.classList.remove('hidden');
                ui.editorPalette.classList.remove('hidden');
                initEditorPalette();
            };

            // HUD / 一時停止
            document.getElementById('btn-pause').onclick = () => {
                if (gameState === 'playing') {
                    gameState = 'paused';
                    ui.pauseScreen.classList.remove('hidden');
                }
            };
            document.getElementById('btn-resume').onclick = () => {
                gameState = 'playing';
                ui.pauseScreen.classList.add('hidden');
            };
            document.getElementById('btn-restart').onclick = () => {
                ui.pauseScreen.classList.add('hidden');
                resetPlayer();
                gameState = 'playing';
            };
            document.getElementById('btn-quit').onclick = () => {
                ui.pauseScreen.classList.add('hidden');
                ui.hudLayer.classList.add('hidden');
                ui.startScreen.classList.remove('hidden');
                gameState = 'start';
            };

            // クリア画面
            document.getElementById('btn-clear-ok').onclick = () => {
                ui.clearScreen.classList.add('hidden');
                ui.hudLayer.classList.add('hidden');
                ui.startScreen.classList.remove('hidden');
                gameState = 'start';
            };

            // 練習モードのチェックポイント
            document.getElementById('btn-place-check').onclick = () => {
                if (gameState === 'playing' && isPractice) {
                    player.checkpoints.push({ ...player });
                }
            };
            document.getElementById('btn-remove-check').onclick = () => {
                if (gameState === 'playing' && isPractice && player.checkpoints.length > 0) {
                    player.checkpoints.pop();
                }
            };

            // エディター操作ボタン
            document.getElementById('btn-editor-exit').onclick = () => {
                ui.editorToolbar.classList.add('hidden');
                ui.editorPalette.classList.add('hidden');
                ui.startScreen.classList.remove('hidden');
                gameState = 'start';
            };
            document.getElementById('btn-editor-clear').onclick = () => {
                customLevel.objects = [];
            };
            document.getElementById('btn-editor-scroll-left').onclick = () => {
                editorScrollX = Math.max(0, editorScrollX - 200);
            };
            document.getElementById('btn-editor-scroll-right').onclick = () => {
                editorScrollX += 200;
            };
            document.getElementById('btn-editor-test').onclick = () => {
                currentLevelIdx = 3;
                isPractice = false;
                ui.editorToolbar.classList.add('hidden');
                ui.editorPalette.classList.add('hidden');
                startPlay();
            };

            // ミュートボタン
            document.getElementById('btn-audio-toggle').onclick = () => {
                sound.muted = !sound.muted;
                document.getElementById('audio-icon').className = sound.muted ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
            };

            // タップ・キー入力のレスポンス
            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowUp') {
                    handleJumpInput(true);
                }
                if (e.code === 'KeyZ') document.getElementById('btn-place-check').click();
                if (e.code === 'KeyX') document.getElementById('btn-remove-check').click();
            });
            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowUp') {
                    handleJumpInput(false);
                }
            });

            canvas.addEventListener('mousedown', (e) => {
                sound.init();
                if (gameState === 'editor') {
                    handleEditorClick(e);
                } else if (gameState === 'playing') {
                    handleJumpInput(true);
                }
            });
            canvas.addEventListener('mouseup', () => handleJumpInput(false));

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                sound.init();
                if (gameState === 'editor') {
                    const touch = e.touches[0];
                    handleEditorClick(touch);
                } else if (gameState === 'playing') {
                    handleJumpInput(true);
                }
            }, { passive: false });

            canvas.addEventListener('touchend', () => handleJumpInput(false));
        }

        let isHoldingJump = false;

        function handleJumpInput(isDown) {
            isHoldingJump = isDown;
            if (isDown && gameState === 'playing') {
                triggerJump();
            }
        }

        function triggerJump() {
            if (player.mode === 'cube' && player.isGrounded) {
                player.vy = -12 * player.gravity;
                player.isGrounded = false;
                sound.playJump();
            }
            // オーブ判定
            const curLevel = getCurrentLevel();
            for (let obj of curLevel.objects) {
                if (obj.type.startsWith('orb_')) {
                    const dx = (player.x + player.w / 2) - (obj.x + 20);
                    const dy = (player.y + player.h / 2) - (obj.y + 20);
                    if (Math.sqrt(dx * dx + dy * dy) < 45) {
                        player.vy = -13 * player.gravity;
                        sound.playOrb();
                        break;
                    }
                }
            }
        }

        function updateLevelCard() {
            if (currentLevelIdx === 3) {
                ui.levelNum.textContent = 'カスタム';
                ui.levelName.textContent = customLevel.name;
                ui.levelDiff.textContent = customLevel.diff;
            } else {
                const lvl = levels[currentLevelIdx];
                ui.levelNum.textContent = `レベル ${currentLevelIdx + 1}`;
                ui.levelName.textContent = lvl.name;
                ui.levelDiff.textContent = lvl.diff;
            }
            ui.levelBestBar.style.width = '0%';
            ui.levelBestText.textContent = '最高記録: 0%';
        }

        function initEditorPalette() {
            ui.editorPalette.innerHTML = '';
            editorItems.forEach(item => {
                const btn = document.createElement('button');
                btn.className = `btn-gd flex-shrink-0 px-3 py-1.5 rounded-lg border text-xs font-bold flex items-center gap-1.5 ${selectedEditorItem === item.id ? 'bg-cyan-950 border-cyan-400 text-cyan-300' : 'bg-slate-900 border-slate-700 text-slate-400'}`;
                btn.innerHTML = `<i class="fa-solid ${item.icon}" style="color:${item.color}"></i> ${item.name}`;
                btn.onclick = () => {
                    selectedEditorItem = item.id;
                    initEditorPalette();
                };
                ui.editorPalette.appendChild(btn);
            });
        }

        function handleEditorClick(e) {
            const rect = canvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * (CANVAS_WIDTH / rect.width);
            const clickY = (e.clientY - rect.top) * (CANVAS_HEIGHT / rect.height);

            const gridX = Math.floor((clickX + editorScrollX) / GRID_SIZE) * GRID_SIZE;
            const gridY = Math.floor(clickY / GRID_SIZE) * GRID_SIZE;

            if (selectedEditorItem === 'eraser') {
                customLevel.objects = customLevel.objects.filter(obj => !(obj.x === gridX && obj.y === gridY));
            } else {
                customLevel.objects = customLevel.objects.filter(obj => !(obj.x === gridX && obj.y === gridY));
                customLevel.objects.push({ type: selectedEditorItem, x: gridX, y: gridY });
            }
        }

        function startPlay() {
            attempts = 1;
            resetPlayer();
            gameState = 'playing';

            ui.startScreen.classList.add('hidden');
            ui.hudLayer.classList.remove('hidden');

            const lvl = getCurrentLevel();
            ui.hudTitle.textContent = lvl.name;
            ui.hudAttempts.textContent = attempts;

            if (isPractice) {
                ui.practiceControls.classList.remove('hidden');
                ui.practiceBadge.classList.remove('hidden');
            } else {
                ui.practiceControls.classList.add('hidden');
                ui.practiceBadge.classList.add('hidden');
            }
        }

        function resetPlayer() {
            player.x = 100;
            player.y = GROUND_Y - 38;
            player.w = 38;
            player.h = 38;
            player.vy = 0;
            player.rotation = 0;
            player.isGrounded = true;
            player.mode = 'cube';
            player.gravity = 1;
            cameraX = 0;

            if (isPractice && player.checkpoints.length > 0) {
                const cp = player.checkpoints[player.checkpoints.length - 1];
                Object.assign(player, cp);
                cameraX = player.x - 100;
            }
        }

        let lastTime = performance.now();
        let accumulator = 0;

        function updatePhysics() {
            if (gameState !== 'playing') return;

            const curLevel = getCurrentLevel();

            // 前進移動
            player.x += curLevel.speed;
            cameraX = player.x - 100;

            // シップモードの操作
            if (player.mode === 'ship') {
                if (isHoldingJump) player.vy -= 0.6 * player.gravity;
                else player.vy += 0.5 * player.gravity;
                player.vy = Math.max(-8, Math.min(8, player.vy));
                player.rotation = player.vy * 0.05;
            } else {
                // キューブモードの重力処理
                player.vy += 0.7 * player.gravity;
                if (!player.isGrounded) {
                    player.rotation += 0.15 * player.gravity;
                } else {
                    player.rotation = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
                }
            }

            player.y += player.vy;

            // 地面衝突
            if (player.gravity === 1 && player.y >= GROUND_Y - player.h) {
                player.y = GROUND_Y - player.h;
                player.vy = 0;
                player.isGrounded = true;
            } else if (player.gravity === -1 && player.y <= 0) {
                player.y = 0;
                player.vy = 0;
                player.isGrounded = true;
            } else {
                player.isGrounded = false;
            }

            // オブジェクトとの当たり判定（インセット本家仕様）
            for (let obj of curLevel.objects) {
                // トゲ
                if (obj.type === 'spike') {
                    if (checkHitbox(player, { x: obj.x + 8, y: obj.y + 12, w: 24, h: 26 })) {
                        handleDeath();
                        return;
                    }
                }
                // ノコギリ
                else if (obj.type === 'saw') {
                    const dx = (player.x + player.w / 2) - (obj.x + 20);
                    const dy = (player.y + player.h / 2) - (obj.y + 20);
                    if (Math.sqrt(dx * dx + dy * dy) < 18) {
                        handleDeath();
                        return;
                    }
                }
                // ブロック
                else if (obj.type === 'block') {
                    if (checkHitbox(player, { x: obj.x, y: obj.y, w: 40, h: 40 })) {
                        // 上に着地
                        if (player.vy > 0 && player.y + player.h - player.vy <= obj.y + 10) {
                            player.y = obj.y - player.h;
                            player.vy = 0;
                            player.isGrounded = true;
                        } else {
                            handleDeath();
                            return;
                        }
                    }
                }
                // ジャンプパッド
                else if (obj.type === 'pad_yellow') {
                    if (checkHitbox(player, { x: obj.x, y: obj.y + 20, w: 40, h: 20 })) {
                        player.vy = -16 * player.gravity;
                        sound.playOrb();
                    }
                }
                // ポータル類
                else if (obj.type === 'portal_ship') {
                    if (checkHitbox(player, { x: obj.x, y: obj.y, w: 40, h: 60 })) player.mode = 'ship';
                } else if (obj.type === 'portal_cube') {
                    if (checkHitbox(player, { x: obj.x, y: obj.y, w: 40, h: 60 })) player.mode = 'cube';
                } else if (obj.type === 'portal_gravity') {
                    if (checkHitbox(player, { x: obj.x, y: obj.y, w: 40, h: 60 })) player.gravity *= -1;
                }
                // ゴール
                else if (obj.type === 'goal') {
                    if (checkHitbox(player, { x: obj.x, y: obj.y, w: 40, h: 80 })) {
                        triggerVictory();
                        return;
                    }
                }
            }

            // HUD更新
            const progress = Math.min(100, Math.floor((player.x / curLevel.length) * 100));
            ui.hudProgressText.textContent = `${progress}%`;
            ui.hudProgressBar.style.width = `${progress}%`;
        }

        function checkHitbox(r1, r2) {
            return !(r1.x + r1.w < r2.x || r1.x > r2.x + r2.w || r1.y + r1.h < r2.y || r1.y > r2.y + r2.h);
        }

        function handleDeath() {
            sound.playExplode();
            attempts++;
            ui.hudAttempts.textContent = attempts;
            resetPlayer();
        }

        function triggerVictory() {
            gameState = 'clear';
            stars += 3;
            orbs += 10;
            ui.starsDisplay.textContent = stars;
            ui.orbsDisplay.textContent = orbs;

            document.getElementById('clear-level-name').textContent = getCurrentLevel().name;
            ui.clearScreen.classList.remove('hidden');
        }

        function render() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            if (gameState === 'editor') {
                drawEditorGrid();
                drawObjects(editorScrollX);
            } else if (gameState === 'playing' || gameState === 'paused') {
                drawBackground();
                drawObjects(cameraX);
                drawPlayer();
            } else {
                drawBackground();
            }
        }

        function drawBackground() {
            // 背景グリッド
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.08)';
            ctx.lineWidth = 1;
            for (let x = - (cameraX % 40); x < CANVAS_WIDTH; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, CANVAS_HEIGHT);
                ctx.stroke();
            }
            // 地面
            ctx.fillStyle = '#080c1c';
            ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(CANVAS_WIDTH, GROUND_Y);
            ctx.stroke();
        }

        function drawEditorGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            for (let x = - (editorScrollX % GRID_SIZE); x < CANVAS_WIDTH; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, CANVAS_HEIGHT);
                ctx.stroke();
            }
            for (let y = 0; y < CANVAS_HEIGHT; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }
            // 地面線
            ctx.strokeStyle = '#ff007f';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(CANVAS_WIDTH, GROUND_Y);
            ctx.stroke();
        }

        function drawObjects(offsetX) {
            const curLevel = getCurrentLevel();
            for (let obj of curLevel.objects) {
                const drawX = obj.x - offsetX;
                if (drawX < -50 || drawX > CANVAS_WIDTH + 50) continue;

                if (obj.type === 'block') {
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(drawX, obj.y, 40, 40);
                    ctx.strokeStyle = '#00f3ff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(drawX, obj.y, 40, 40);
                } else if (obj.type === 'spike') {
                    ctx.fillStyle = '#ff007f';
                    ctx.beginPath();
                    ctx.moveTo(drawX + 20, obj.y);
                    ctx.lineTo(drawX + 40, obj.y + 40);
                    ctx.lineTo(drawX, obj.y + 40);
                    ctx.closePath();
                    ctx.fill();
                } else if (obj.type === 'saw') {
                    ctx.save();
                    ctx.translate(drawX + 20, obj.y + 20);
                    ctx.rotate(Date.now() * 0.005);
                    ctx.strokeStyle = '#ffe600';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, 18, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                } else if (obj.type.startsWith('pad_') || obj.type.startsWith('orb_')) {
                    ctx.fillStyle = '#ffe600';
                    ctx.beginPath();
                    ctx.arc(drawX + 20, obj.y + 20, 12, 0, Math.PI * 2);
                    ctx.fill();
                } else if (obj.type.startsWith('portal_')) {
                    ctx.strokeStyle = '#a855f7';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(drawX + 5, obj.y, 30, 60);
                } else if (obj.type === 'goal') {
                    ctx.fillStyle = '#22c55e';
                    ctx.fillRect(drawX + 10, obj.y, 20, 80);
                }
            }
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x - cameraX + player.w / 2, player.y + player.h / 2);
            ctx.rotate(player.rotation);

            // キューブ描画
            ctx.fillStyle = primaryColor;
            ctx.fillRect(-player.w / 2, -player.h / 2, player.w, player.h);
            ctx.strokeStyle = secondaryColor;
            ctx.lineWidth = 3;
            ctx.strokeRect(-player.w / 2, -player.h / 2, player.w, player.h);

            // 目
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-6, -8, 5, 8);
            ctx.fillRect(3, -8, 5, 8);

            ctx.restore();
        }

        function drawShopPreview() {
            const shopCanvas = document.getElementById('shopPreviewCanvas');
            const sCtx = shopCanvas.getContext('2d');
            sCtx.clearRect(0, 0, 100, 100);
            sCtx.fillStyle = primaryColor;
            sCtx.fillRect(25, 25, 50, 50);
            sCtx.strokeStyle = secondaryColor;
            sCtx.lineWidth = 4;
            sCtx.strokeRect(25, 25, 50, 50);
            sCtx.fillStyle = '#ffffff';
            sCtx.fillRect(38, 38, 7, 10);
            sCtx.fillRect(55, 38, 7, 10);
        }

        function gameLoop(now) {
            const elapsed = now - lastTime;
            lastTime = now;
            accumulator += elapsed;

            while (accumulator >= FIXED_TIMESTEP) {
                updatePhysics();
                accumulator -= FIXED_TIMESTEP;
            }

            render();
            requestAnimationFrame(gameLoop);
        }

        window.onload = () => {
            setupEventListeners();
            updateLevelCard();

            // ショップのパレット初期化
            const primaryPalette = document.getElementById('palette-primary');
            const secondaryPalette = document.getElementById('palette-secondary');
            const colors = ['#00f3ff', '#ff007f', '#ffe600', '#22c55e', '#a855f7', '#ffffff'];

            colors.forEach(c => {
                const b1 = document.createElement('div');
                b1.className = 'w-8 h-8 rounded-full cursor-pointer border-2 border-white/40 hover:scale-110 transition';
                b1.style.backgroundColor = c;
                b1.onclick = () => { primaryColor = c; drawShopPreview(); };
                primaryPalette.appendChild(b1);

                const b2 = document.createElement('div');
                b2.className = 'w-8 h-8 rounded-full cursor-pointer border-2 border-white/40 hover:scale-110 transition';
                b2.style.backgroundColor = c;
                b2.onclick = () => { secondaryColor = c; drawShopPreview(); };
                secondaryPalette.appendChild(b2);
            });

            requestAnimationFrame(gameLoop);
        };
    </script>

            position: fixed;

            color: #5ac8fa;

            text-decoration: none;
            box-shadow: 0 0 10px rgba(90, 200, 250, 0.35);
            white-space: nowrap;
        }
        .hub-back-btn:hover { background: rgba(20, 40, 60, 0.9); }
